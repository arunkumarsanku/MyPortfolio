apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myportfolio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: myportfolio.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myportfolio
            port:
              number: 80